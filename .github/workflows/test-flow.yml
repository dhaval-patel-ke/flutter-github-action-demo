name: Run Test Flow

on:
  push:
    branches: [ 'main' ]

permissions:
  actions: write
  contents: write

env:
  APK_NAME: "DazzleMe-Staging.apk"
  IPA_NAME: "DazzleMe-Staging.ipa"
  APP_NAME: "DazzleMe App - Staging"
  APP_LOGO: "https://wheelhouse.site/assets/front/images/logo.png"
  TASK_NAME: "API Automation Workflow Report"
  TASK_SUCCESS_MESSAGE: "API is working fine. Nothing to worry about. 🧘"
  TASK_FAILURE_MESSAGE: "API failure detected. Please check report for more details. 🚨🚨🚨"
  FIREBASE_DISTRIBUTION_LINK: "https://appdistribution.firebase.google.com/testerapps/"

jobs:
  deploy-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      android-version: ${{ steps.android-version.outputs.VERSION_NAME }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Define Long JSON Text and Assign to ENV
        if: ${{ success() }}
        shell: bash
        run: |
          if dart format lib | grep -q "0 changed"; then
            exit 0
          else
            exit 1
          fi
